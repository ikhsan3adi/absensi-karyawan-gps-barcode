services:
  # Single container running nginx, php-fpm, queue worker, and scheduler
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: absensi-app
    restart: unless-stopped
    env_file:
      - ./docker/dev.env
    volumes:
      # Bind source for live edits; vendor/node_modules come from the image
      - ./:/var/www/html:cached
      - /var/www/html/vendor
      - /var/www/html/node_modules
      # Survive rebuilds and container recreation
      - storage-data:/var/www/html/storage
      - cache-data:/var/www/html/bootstrap/cache
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - absensi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # mysql_native_password keeps PHP's mysqlnd auth compatible
  db:
    image: mysql:8.0
    container_name: absensi-db
    restart: unless-stopped
    env_file:
      - ./docker/dev.env
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - absensi-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: absensi-phpmyadmin
    restart: unless-stopped
    env_file:
      - ./docker/dev.env
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - absensi-network
    profiles:
      - tools

  redis:
    image: redis:7-alpine
    container_name: absensi-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - absensi-network
    profiles:
      - tools
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  db-data:
    driver: local
  storage-data:
    driver: local
  cache-data:
    driver: local
  redis-data:
    driver: local

networks:
  absensi-network:
    driver: bridge